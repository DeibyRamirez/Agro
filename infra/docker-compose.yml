services:
  postgres:
    image: postgres:16-alpine
    container_name: agrocontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agro_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agrocontrol}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agrocontrol_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agro} -d ${POSTGRES_DB:-agrocontrol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: agrocontrol-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agrocontrol_pg_data:
